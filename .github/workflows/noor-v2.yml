# Noor v2 (spec 001) — runs on the branches we actually use (constitution: CI on the real target branch).
# The legacy ci-cd.yml is left untouched here (SYS-06 is a separate spec).
name: Noor v2

on:
  push:
    branches: ["main", "master", "noor-v2", "feat/**", "[0-9][0-9][0-9]-*"]
  pull_request:
    branches: ["main", "master", "noor-v2"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest flask jsonschema python-docx cryptography==50.0.2 ruff==0.17.2
          pip install -e packages/noor_contracts
      - name: Lint new code (T004, ruff)
        run: ruff check --config packages/noor_contracts/pyproject.toml packages platforms tools tests/support tests/e2e
      - name: Tests
        run: |
          set +e
          # Imported NMIS tests: first run is the owner's baseline (T047, NMIS-N10), not CI's.
          python -m pytest -q packages platforms tools/tests tests/support tests/e2e --ignore=platforms/nmis/full
          code=$?
          # 5 = no tests collected (allowed while platforms are still empty)
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi

  radar-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Radar export tests
        run: |
          if ls platforms/radar/test/*.test.mjs >/dev/null 2>&1; then
            node --test platforms/radar/test/
          else
            echo "no radar tests yet"
          fi

  public-repo-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The private names blocklist never goes to GitHub, so this CI scan does NOT check names.
      # The delivery scan (T099) runs locally with --require-blocklist.
      - name: Scan changed files for secrets and paths (names NOT checked in CI)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif git rev-parse --verify 'HEAD~1^{commit}' >/dev/null 2>&1; then
            base="HEAD~1"
          else
            python tools/scan_public_repo.py --paths .
            exit $?
          fi
          python tools/scan_public_repo.py --diff "$base"
