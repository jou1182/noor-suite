{# مظهر خاص بالشركة (2026-09-25): "skin" في هوية الشركة ← templates/skins/<skin>.css + الجرس وزر الوضع (noor_shell.js). الفاتح افتراضي. بلا skin = لا شيء (النور كما هو). #}{% if co.skin %}<script>(function(){var t;try{t=localStorage.getItem("noor-theme")}catch(e){}t=t==="dark"?"dark":"light";document.documentElement.setAttribute("data-theme",t);if(t==="dark"&&window.Chart){Chart.defaults.color="#B4C0D4";Chart.defaults.borderColor="#2B3A55"}})();</script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><style>{% include "skins/" ~ co.skin ~ ".css" %}</style><script>{% include "skins/noor_shell.js" %}</script>{% endif %}
