[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noor-contracts"
version = "0.1.0"
description = "Versioned noor.*/v1 JSON contracts and validator for the Noor single-thread demo (spec 001)"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[tool.setuptools.packages.find]
include = ["noor_contracts*"]

[tool.setuptools.package-data]
noor_contracts = ["schemas/*.json"]

# T004 (proposed by Eng. Yousef 2026-10-24, pending his sole decision since the 2026-10-27 governance amendment): ruff for new code only.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, subprocess with list args, fixed SQL table names, fake credentials.
"**/tests/**" = ["S101", "S603", "S607", "S108", "S608", "S105", "S104"]
